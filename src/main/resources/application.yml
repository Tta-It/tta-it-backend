spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: TtaIt
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jackson:
    time-zone: Asia/Seoul
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.ttait.domain.user.domain
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'NULL'

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

app:
  jwt:
    issuer: ${JWT_ISSUER:ttait}
    secret-key: ${JWT_SECRET_KEY}
    access-token-validity-seconds: ${JWT_ACCESS_TOKEN_VALIDITY_SECONDS:14400}
  file:
    upload-dir: ${FILE_UPLOAD_DIR:./uploads}

logging:
  level:
    com.ttait: INFO
    org.mybatis: DEBUG
